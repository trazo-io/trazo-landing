name: Claude Code Review

# COST NOTE: this repo merges ~2 PRs/day. `synchronize` is deliberately NOT a trigger —
# reviewing every push multiplies runs by the number of pushes per PR (3-5x here) and
# programmatic Claude usage bills at API rates against a separate monthly credit pool
# (Anthropic, 2026-06-15), not against interactive plan limits. One review per PR.
# Add the `skip-review` label to a PR to suppress it. Re-review on demand with
# `@claude review this` (claude.yml), which costs nothing when you don't ask.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-review')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      # WRITE, not read. The prompt runs `/code-review --comment`, whose only allowed tool is
      # `create_inline_comment`. Under `pull-requests: read` the review spends its budget and
      # then cannot post a single line of what it found. Anthropic's own docs example says
      # `read`; it is wrong for a workflow that comments.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4169884de317bc1b4cb1b47f4476d76fed92b384 # v1
        env:
          # The review skill delegates its gating checks and its 5 parallel reviewers to
          # subagents. By default those run as BACKGROUND tasks, and a non-interactive turn
          # ends without waiting for them: measured 2026-09-24, the run reported success in
          # 16.5s for $0.09 after saying "I'll wait for those", with 2 task_started and
          # 2 background_tasks_changed events and no review produced. This forces every
          # subagent into the foreground so the turn waits for its own work.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # NOTE: temporary, remove once a review has posted cleanly. Without it the action
          # withholds the reason a run failed, which is why the 2026-09-18 failure on this
          # workflow (init succeeded, zero model calls, is_error true) could not be diagnosed.
          show_full_output: true
          # `--max-budget-usd` was removed: it was never verified to abort a run rather than
          # only report, and it was the one unvetted flag in this config. The trigger set is
          # the real cost control: one review per PR, no `synchronize`.
          # `Skill` MUST be listed. `--allowedTools` is the approval list for a
          # non-interactive run, and the prompt below invokes a skill. Without `Skill` the
          # action denies `Execute skill: code-review:code-review`, the skill never launches,
          # its own `allowed-tools` grants (Bash(gh pr diff:*), Bash(gh pr view:*), ...) never
          # take effect, and Claude improvises with `gh api --paginate`, which is not on that
          # list and is denied too. Measured on 2026-09-24: 7 denials, 132s of model time,
          # zero findings posted. `Task`, `Read` and `Grep` are permitted by default and do
          # not need listing; only `Skill` and the comment-posting MCP tool do.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment"
